# Publishes a GitHub release for a pushed tag (git tag v0.1.0 && git push --tags):
# signal-headless-linux-x64.tar.gz, install.sh and SHA256SUMS. Asset names
# carry no version, so …/releases/latest/download/<asset> always resolves.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux-x64:
    # 22.04 (glibc 2.35) keeps the binary runnable on older systems; the
    # same base as build/dist.sh.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev cmake
      - name: protoc
        run: |
          curl -sSfL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
          sudo unzip -o -q /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
      - name: Cache libsignal
        uses: actions/cache@v4
        with:
          path: |
            third_party/libsignal
            ~/.cargo/registry
          key: libsignal-${{ runner.os }}-${{ hashFiles('Makefile') }}
      - name: Build
        run: make build VERSION="$GITHUB_REF_NAME"
      - run: make test
      - name: Check the glibc floor
        run: |
          need=$(objdump -T bin/signal-headless | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)
          echo "requires $need"
          [ "$(printf '%s\nGLIBC_2.35\n' "$need" | sort -V | tail -1)" = GLIBC_2.35 ]
      - name: Package
        run: build/package.sh bin/signal-headless linux-x64 dist/release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/* \
            --verify-tag --title "signal-headless $GITHUB_REF_NAME" --generate-notes

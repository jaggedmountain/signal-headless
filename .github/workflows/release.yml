# Publishes a GitHub release for a pushed tag (git tag v0.1.0 && git push --tags):
# signal-headless-<os>-<arch>.tar.gz for each platform below, install.sh,
# install.ps1 and
# SHA256SUMS. Asset names carry no version, so
# …/releases/latest/download/<asset> always resolves.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 (glibc 2.35) keeps the Linux binaries runnable on
          # older systems; the same base as build/dist.sh.
          # experimental: not yet proven by a release; a failure there leaves
          # that platform out instead of blocking the release.
          - { platform: linux-x64, runner: ubuntu-22.04, protoc: linux-x86_64 }
          - { platform: linux-arm64, runner: ubuntu-22.04-arm, protoc: linux-aarch_64, experimental: true }
          - { platform: darwin-arm64, runner: macos-14, experimental: true }
          - { platform: darwin-x64, runner: macos-15-intel, experimental: true }
          - { platform: windows-x64, runner: windows-latest, shell: 'msys2 {0}', experimental: true }
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental == true }}
    defaults:
      run:
        shell: ${{ matrix.shell || 'bash' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev cmake
          # 22.04's protoc 3.12 predates proto3 optional fields, which libsignal uses.
          curl -sSfL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-${{ matrix.protoc }}.zip"
          sudo unzip -o -q /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
      - name: Build dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            make git
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-clang
            mingw-w64-x86_64-protobuf mingw-w64-x86_64-zlib mingw-w64-x86_64-dlfcn
      - name: Toolchain settings (Windows; see ci.yml)
        if: runner.os == 'Windows'
        run: |
          rustup set default-host x86_64-pc-windows-gnu
          {
            echo "LIBCLANG_PATH=$(cygpath -w /mingw64/bin)"
            echo "CC=gcc"
            echo "CXX=g++"
            echo "CMAKE_TOOLCHAIN_FILE_x86_64_pc_windows_gnu=$(cygpath -m "$PWD/build/windows-boringssl.cmake")"
          } >>"$GITHUB_ENV"
      - name: Build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf gnu-tar
      - name: Rust
        if: runner.os != 'Windows'  # preinstalled there, set up above
        run: |
          # libsignal's rust-toolchain file picks the toolchain; rustup fetches it.
          command -v rustup >/dev/null || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
      - name: libsignal revision
        id: libsignal
        run: echo "rev=$(awk '$1 == "LIBSIGNAL_REV" { print $3 }' Makefile)" >>"$GITHUB_OUTPUT"
      - name: Cache libsignal
        uses: actions/cache@v4
        with:
          path: |
            third_party/libsignal
            ~/.cargo/registry
          key: libsignal-${{ matrix.platform }}-${{ steps.libsignal.outputs.rev }}
      - name: Build
        run: make build VERSION="$GITHUB_REF_NAME"
      - run: make test
      - name: Smoke test (fake daemon - start, status, stop)
        run: build/smoke.sh bin/signal-headless${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Check the glibc floor
        if: runner.os == 'Linux'
        run: |
          need=$(objdump -T bin/signal-headless | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)
          echo "requires $need"
          [ "$(printf '%s\nGLIBC_2.35\n' "$need" | sort -V | tail -1)" = GLIBC_2.35 ]
      - name: Check the macOS dependencies
        if: runner.os == 'macOS'
        run: |
          # Only system libraries, nothing from Homebrew; and the deployment target.
          otool -L bin/signal-headless
          if otool -L bin/signal-headless | tail -n +2 | grep -vE '^[[:space:]]+(/usr/lib/|/System/Library/)'; then
            echo 'links libraries outside the OS (above)' >&2
            exit 1
          fi
          otool -l bin/signal-headless | grep -A3 LC_BUILD_VERSION
      - name: Check the Windows dependencies
        if: runner.os == 'Windows'
        run: |
          # Only Windows' own DLLs: no mingw runtime (libstdc++-6.dll, ...),
          # which a normal Windows install doesn't have.
          objdump -p bin/signal-headless.exe | grep 'DLL Name'
          if objdump -p bin/signal-headless.exe | grep 'DLL Name' | grep -iE 'lib[^ ]*\.dll|zlib'; then
            echo 'depends on mingw DLLs (above)' >&2
            exit 1
          fi
      - name: Smoke test outside MSYS2 (plain PowerShell PATH)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/smoke.ps1 bin/signal-headless.exe
      - name: Package
        run: build/package.sh bin/signal-headless${{ runner.os == 'Windows' && '.exe' || '' }} ${{ matrix.platform }} dist/${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/signal-headless-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true
      - name: Checksums
        run: |
          install -m755 build/install.sh dist/release/install.sh
          install -m644 build/install.ps1 dist/release/install.ps1
          cd dist/release && sha256sum -- * >SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v1.2.3-rc.1 and the like: a pre-release, never "latest", so
          # install.sh and releases/latest/download/… keep the last real one.
          pre=()
          case $GITHUB_REF_NAME in *-*) pre=(--prerelease --latest=false) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/release/* "${pre[@]}" \
            --verify-tag --title "signal-headless $GITHUB_REF_NAME" --generate-notes

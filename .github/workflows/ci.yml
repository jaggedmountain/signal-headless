name: ci

on:
  push:
    branches: [main, ci-testing]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev cmake
      - name: protoc (22.04's 3.12 predates proto3 optional fields, which libsignal uses)
        run: |
          curl -sSfL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
          sudo unzip -o -q /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
      - name: libsignal revision
        id: libsignal
        run: echo "rev=$(awk '$1 == "LIBSIGNAL_REV" { print $3 }' Makefile)" >>"$GITHUB_OUTPUT"
      - name: Cache libsignal
        uses: actions/cache@v4
        with:
          path: |
            third_party/libsignal
            ~/.cargo/registry
          key: libsignal-linux-x64-${{ steps.libsignal.outputs.rev }}
      - run: make build
      - run: make test
      - run: build/smoke.sh bin/signal-headless
      - run: make vet
      - name: gofmt
        run: test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
      - name: Windows type-check (no Windows build yet; docs/portability.md)
        run: |
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
          GOOS=windows CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc go vet ./...

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: brew install protobuf
      - name: Rust
        run: |
          command -v rustup >/dev/null || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
      - name: libsignal revision
        id: libsignal
        run: echo "rev=$(awk '$1 == "LIBSIGNAL_REV" { print $3 }' Makefile)" >>"$GITHUB_OUTPUT"
      - name: Cache libsignal
        uses: actions/cache@v4
        with:
          path: |
            third_party/libsignal
            ~/.cargo/registry
          key: libsignal-darwin-arm64-${{ steps.libsignal.outputs.rev }}
      - run: make build
      - run: make test
      - run: build/smoke.sh bin/signal-headless
      - name: Libraries libsignal needs (for the Makefile's link flags)
        if: failure()
        run: |
          cd third_party/libsignal
          cargo rustc -p libsignal-ffi --profile=release --crate-type staticlib -- --print native-static-libs 2>&1 | grep -i native-static-libs || true

  windows:
    # MSYS2 MINGW64 gcc for cgo, and libsignal for Rust's
    # x86_64-pc-windows-gnu target so both sides speak mingw
    # (docs/portability.md).
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      # Without these, BoringSSL's CMake looks for MSVC's cl.
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            make git
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-clang
            mingw-w64-x86_64-protobuf mingw-w64-x86_64-zlib mingw-w64-x86_64-dlfcn
      - name: Rust (windows-gnu host, so libsignal's rust-toolchain resolves to it)
        run: |
          rustup set default-host x86_64-pc-windows-gnu
          # bindgen (boring-sys) loads libclang.dll from MSYS2.
          echo "LIBCLANG_PATH=$(cygpath -w /mingw64/bin)" >>"$GITHUB_ENV"
          # BoringSSL without assembly (see the file).
          echo "CMAKE_TOOLCHAIN_FILE_x86_64_pc_windows_gnu=$(cygpath -m "$PWD/build/windows-boringssl.cmake")" >>"$GITHUB_ENV"
      - name: libsignal revision
        id: libsignal
        run: echo "rev=$(awk '$1 == "LIBSIGNAL_REV" { print $3 }' Makefile)" >>"$GITHUB_OUTPUT"
      - name: Cache libsignal
        uses: actions/cache@v4
        with:
          path: |
            third_party/libsignal
            ~/.cargo/registry
          key: libsignal-windows-x64-${{ steps.libsignal.outputs.rev }}
      - run: make build
      - run: make test
      - run: build/smoke.sh bin/signal-headless.exe
      - name: Libraries libsignal needs (for the Makefile's link flags)
        if: failure()
        run: |
          cd third_party/libsignal
          cargo rustc -p libsignal-ffi --profile=release --crate-type staticlib -- --print native-static-libs 2>&1 | grep -i native-static-libs || true
